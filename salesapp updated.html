function bulkSelectAll(on) { document.querySelectorAll(".bulkSel").forEach(c => { c.checked = on; }); }
function bulkAction(kind) {
  const ids = [...document.querySelectorAll(".bulkSel:checked")].map(c => c.value);
  if (!ids.length) { alert("Tick at least one follow-up first."); return; }
  if (kind === "move") {
    const d = document.getElementById("bulkDate").value;
    if (!d) { alert("Pick a date."); return; }
    if (!confirm(`Move ${ids.length} follow-up(s) to ${fmtDate(d)}?`)) return;
    ids.forEach(id => rescheduleTask(id, d));
  } else if (kind === "done") {
    if (!confirm(`Mark ${ids.length} follow-up(s) as done?`)) return;
    ids.forEach(id => completeTask(id, "Bulk marked done"));
  } else {
    if (!confirm(`Cancel ${ids.length} follow-up(s)? They stay in each customer's history.`)) return;
    ids.forEach(id => cancelTask(id, "Bulk cancelled"));
  }
  save(); renderContent();
  toast(`${ids.length} follow-up(s) updated`);
}

/* ===================== NEW FOLLOW-UP ===================== */
function facPickerHtml(inputId, fid, onPick) {
  return `<input id="${inputId}" list="facList_${inputId}" placeholder="Type clinic name…" autocomplete="off" value="${esc(fid ? facilityInputValue(fid) : "")}" ${onPick ? `onchange="${onPick}"` : ""}>
    <datalist id="facList_${inputId}">${facilityDatalist()}</datalist>`;
}
function recentFacilityChips(onclickFn) {
  const ids = [];
  state.route.ids.forEach(id => { if (!ids.includes(id)) ids.push(id); });
  allVisitsFlat().sort((a, b) => (b.date + (b.time || "")).localeCompare(a.date + (a.time || ""))).forEach(v => { if (!ids.includes(v.facilityId)) ids.push(v.facilityId); });
  return ids.slice(0, 6).map(getRec).filter(Boolean).map(r => `<button type="button" class="chip-btn small" onclick="${onclickFn}(${r.id})">${esc(r.name.length > 28 ? r.name.slice(0, 27) + "…" : r.name)}</button>`).join("");
}
function openNewTask(fid) {
  openModal(`
    <div class="modal-head"><h3>New follow-up</h3><button onclick="closeModal()">✕</button></div>
    <div class="modal-body">
      <div class="form-row"><label>Customer</label>${facPickerHtml("nt_fac", fid)}</div>
      ${fid ? "" : `<div class="chip-row">${recentFacilityChips("ntPickFac")}</div>`}
      <div class="form-row"><label>What needs doing?</label><input id="nt_title" placeholder="e.g. Send quotation for nitrile gloves"></div>
      <div class="chip-row">${QUICK_TITLES.map(q => `<button type="button" class="chip-btn small" onclick="document.getElementById('nt_title').value='${q}'">${q}</button>`).join("")}</div>
      <div class="form-row" style="margin-top:10px;"><label>When?</label></div>
      <div class="chip-grid" id="nt_dates">
        <button type="button" class="chip-btn" onclick="ntDate('${todayStr()}', this)">Today</button>
        ${quickDates().map(q => `<button type="button" class="chip-btn" onclick="ntDate('${q.d}', this)">${q.lbl}<small>${weekdayName(q.d)}</small></button>`).join("")}
      </div>
      <div class="form-2col" style="margin-top:8px;">
        <div class="form-row"><label>Date</label><input type="date" id="nt_date" value="${addDays(todayStr(), 1)}"></div>
        <div class="form-row"><label>Time (optional)</label><input type="time" id="nt_time"></div>
      </div>
      <div class="form-2col">
        <div class="form-row"><label>Priority</label><select id="nt_prio">${PRIORITY_OPTIONS.map(p => `<option ${p === "Medium" ? "selected" : ""}>${p}</option>`).join("")}</select></div>
        <div class="form-row"><label>Product (optional)</label><input id="nt_product" list="productList" placeholder="e.g. Examination gloves"><datalist id="productList">${buildProductDatalist()}</datalist></div>
      </div>
    </div>
    <div class="modal-foot"><div></div><div class="qa-row"><button class="btn" onclick="closeModal()">Cancel</button><button class="btn btn-primary" onclick="saveNewTask()">Save follow-up</button></div></div>`);
}
function ntPickFac(id) { document.getElementById("nt_fac").value = facilityInputValue(id); }
function ntDate(d, btn) {
  document.getElementById("nt_date").value = d;
  document.querySelectorAll("#nt_dates .chip-btn").forEach(b => b.classList.remove("on"));
  if (btn) btn.classList.add("on");
}
function saveNewTask() {
  const rec = resolveFacilityInput(document.getElementById("nt_fac").value);
  if (!rec) { alert("Pick the customer from the list (start typing the name)."); return; }
  const title = document.getElementById("nt_title").value.trim() || "Follow up";
  const dueDate = document.getElementById("nt_date").value;
  if (!dueDate) { alert("Pick a date."); return; }
  const dueTime = document.getElementById("nt_time").value || "";
  const similar = findSimilarOpenTask(rec.id, title);
  if (similar) {
    if (!confirm(`There's already an open follow-up for ${rec.name}:\n"${similar.title}" (${dueLabel(similar)}).\n\nOK = move that one to ${fmtDate(dueDate)} instead of creating a duplicate.\nCancel = go back.`)) return;
    rescheduleTask(similar.id, dueDate, dueTime);
  } else {
    createTask({ facilityId: rec.id, title, dueDate, dueTime, priority: document.getElementById("nt_prio").value, product: document.getElementById("nt_product").value.trim(), source: "manual" });
  }
  save(); closeModal(); renderContent();
  toast("Follow-up saved for " + fmtDate(dueDate));
}

/* ===================== QUICK VISIT NOTE ===================== */
const QUICK_OUTCOMES = [
  { key: "visited", lbl: "Met — interested" },
  { key: "order", lbl: "Order taken" },
  { key: "follow_up", lbl: "Needs follow-up" },
  { key: "contacted", lbl: "Couldn't meet" },
  { key: "not_interested", lbl: "Not interested" }
];
function openQuickNote(fid, fromTaskId) {
  openModal(`
    <div class="modal-head"><h3>Log visit</h3><button onclick="closeModal()">✕</button></div>
    <div class="modal-body">
      <div class="form-row"><label>Customer</label>${facPickerHtml("qn_fac", fid, "qnFacChanged()")}</div>
      ${fid ? "" : `<div class="chip-row">${recentFacilityChips("qnPickFac")}</div>`}
      <div class="form-row" style="margin-top:6px;"><label>Outcome</label></div>
      <div class="chip-row" id="qn_outcomes">${QUICK_OUTCOMES.map((o, i) => `<button type="button" class="chip-btn small ${i === 0 ? "on" : ""}" data-k="${o.key}" onclick="qnOutcome(this)">${o.lbl}</button>`).join("")}</div>
      <div class="form-row" style="margin-top:8px;"><label>What happened?</label><textarea id="qn_notes" rows="3" placeholder="Products discussed, needs, objections, out-of-stock items…"></textarea></div>
      <div class="form-2col">
        <div class="form-row"><label>Met (name)</label><input id="qn_contact" placeholder="e.g. Dr. Fathima"></div>
        <div class="form-row" id="qn_prodWrap" style="display:none;"><label>Ordered products</label><input id="qn_products" list="productList" placeholder="e.g. gloves x10"><datalist id="productList">${buildProductDatalist()}</datalist></div>
      </div>
      <div class="form-row"><label>If they didn't order — why?</label><select id="qn_reason"><option value="">—</option>${NO_ORDER_REASONS.map(x => `<option>${esc(x)}</option>`).join("")}</select></div>
      <div id="qn_openTasks"></div>
      <div class="form-row" style="margin-top:6px;"><label>Next action (creates a follow-up)</label><input id="qn_next" placeholder="e.g. Send quotation for examination gloves"></div>
      <div class="chip-row" id="qn_dates">
        <button type="button" class="chip-btn small on" onclick="qnDate('', this)">No follow-up</button>
        ${quickDates().map(q => `<button type="button" class="chip-btn small" onclick="qnDate('${q.d}', this)">${q.lbl}</button>`).join("")}
        <input type="date" id="qn_date" onchange="qnDate(this.value, null)" style="max-width:150px;">
      </div>
    </div>
    <div class="modal-foot"><div></div><div class="qa-row"><button class="btn" onclick="closeModal()">Cancel</button><button class="btn btn-primary" id="qn_save" onclick="saveQuickNote()">Save</button></div></div>`);
  window._qnFromTask = fromTaskId || null;
  qnFacChanged();
}
function qnPickFac(id) { document.getElementById("qn_fac").value = facilityInputValue(id); qnFacChanged(); }
function qnOutcome(btn) {
  document.querySelectorAll("#qn_outcomes .chip-btn").forEach(b => b.classList.remove("on"));
  btn.classList.add("on");
  document.getElementById("qn_prodWrap").style.display = btn.dataset.k === "order" ? "" : "none";
}
function qnDate(d, btn) {
  document.getElementById("qn_date").value = d || "";
  document.querySelectorAll("#qn_dates .chip-btn").forEach(b => b.classList.remove("on"));
  if (btn) btn.classList.add("on");
}
function qnFacChanged() {
  const box = document.getElementById("qn_openTasks"); if (!box) return;
  const rec = resolveFacilityInput(document.getElementById("qn_fac").value);
  if (!rec) { box.innerHTML = ""; return; }
  const open = openTasksFor(rec.id), now = todayStr();
  if (rec.contactPerson && !document.getElementById("qn_contact").value) document.getElementById("qn_contact").value = rec.contactPerson;
  box.innerHTML = open.length ? `<div class="open-box"><div class="sub" style="font-weight:700;margin-bottom:4px;">Open follow-ups for this customer — tick the ones this visit takes care of:</div>
    ${open.map(t => `<label class="tag-check" style="display:flex;text-transform:none;margin:4px 0;"><input type="checkbox" class="qnDone" value="${t.id}" ${t.id === window._qnFromTask || t.dueDate <= now ? "checked" : ""}> ${esc(t.title)} <span class="sub">&nbsp;(${esc(dueLabel(t))})</span></label>`).join("")}</div>` : "";
}
function saveQuickNote() {
  const rec = resolveFacilityInput(document.getElementById("qn_fac").value);
  if (!rec) { alert("Pick the customer from the list (start typing the name)."); return; }
  const outcome = (document.querySelector("#qn_outcomes .chip-btn.on") || {}).dataset?.k || "visited";
  const orderPlaced = outcome === "order";
  const status = orderPlaced ? "customer" : outcome;
  const next = document.getElementById("qn_next").value.trim();
  const fuDate = document.getElementById("qn_date").value || "";
  if (next && !fuDate && !confirm("You wrote a next action but picked no follow-up date. Save without a reminder?")) return;
  const btn = document.getElementById("qn_save"); if (btn) btn.disabled = true; // no double-tap duplicates
  logVisitCore(rec.id, null, {
    date: todayStr(), time: nowTime(), status,
    contact: document.getElementById("qn_contact").value.trim(), role: rec.contactRole || "",
    notes: document.getElementById("qn_notes").value.trim(),
    orderPlaced, products: orderPlaced ? document.getElementById("qn_products").value.trim() : "",
    reason: orderPlaced ? "" : document.getElementById("qn_reason").value,
    nextAction: next, nextFollowUp: fuDate || null
  }, [...document.querySelectorAll(".qnDone:checked")].map(c => c.value));
  closeModal(); renderContent();
  toast("Visit saved" + (fuDate ? " · follow-up " + fmtDate(fuDate) : ""));
}

/* ---------- shared visit save: used by the quick note AND the full visit form ----------
   - Ticked open follow-ups are marked done (only when you tick them).
   - The visit's follow-up is ONE task linked to the visit: editing the visit later updates
     that same task instead of creating another one. */
function logVisitCore(facilityId, visitId, data, completeIds) {
  const r = getRec(facilityId);
  let v;
  if (visitId) {
    v = r.visits.find(x => x.id === visitId);
    Object.assign(v, data);
  } else {
    v = Object.assign({ id: uid() }, data);
    r.visits.unshift(v);
    const ri = state.route.ids.indexOf(facilityId);
    if (ri >= 0) state.route.ids.splice(ri, 1);
  }
  (completeIds || []).forEach(id => completeTask(id, "Done during visit on " + fmtDate(v.date)));

  // linked follow-up task
  const linked = state.tasks.find(t => t.visitId === v.id && t.source !== "migrated" && isOpenTask(t))
    || state.tasks.find(t => t.visitId === v.id && isOpenTask(t));
  const title = (v.nextAction || "").trim() || (v.notes ? "Follow up — " + v.notes.slice(0, 80) : "Follow up");
  if (v.nextFollowUp) {
    if (linked) {
      if (linked.title !== title) { linked.title = title; touchTask(linked, "edited"); }
      rescheduleTask(linked.id, v.nextFollowUp);
    } else {
      const similar = findSimilarOpenTask(facilityId, title);
      if (similar) { rescheduleTask(similar.id, v.nextFollowUp); similar.visitId = similar.visitId || v.id; }
      else createTask({ facilityId, title, dueDate: v.nextFollowUp, priority: r.priority || "Medium", source: "visit", visitId: v.id, product: v.products || "" });
    }
  } else if (linked && visitId) {
    cancelTask(linked.id, "Follow-up date removed from the visit");
  }

  // facility roll-ups from visit history (most recent visit wins), follow-up from tasks
  const sorted = r.visits.slice().sort((a, b) => (b.date + (b.time || "")).localeCompare(a.date + (a.time || "")));
  const latest = sorted[0];
  r.lastVisit = latest.date;
  r.status = latest.status;
  if (data.contact) r.contactPerson = data.contact;
  if (data.role !== undefined) r.contactRole = data.role;
  syncFollowUpRollup(facilityId);
  save();
  return v;
}

/* ---------- follow-ups inside the customer detail ---------- */
function detailTasksHtml(id) {
  const open = openTasksFor(id);
  const past = state.tasks.filter(t => t.facilityId === id && !isOpenTask(t)).sort((a, b) => (b.updatedAt || "").localeCompare(a.updatedAt || "")).slice(0, 10);
  return `<div class="section-title" style="margin-top:6px;">Follow-ups <small>${open.length} open</small></div>
    <div class="qa-row" style="margin-bottom:8px;"><button class="btn btn-sm btn-primary" onclick="closeModal(); openNewTask(${id});">+ Follow-up</button></div>
    ${open.length ? open.map(t => taskCardHtml(t, { showLast: false })).join("") : '<div class="empty-state" style="padding:10px;">No open follow-ups.</div>'}
    ${past.length ? `<details style="margin:6px 0 12px 0;"><summary class="sub" style="cursor:pointer;">Completed / cancelled (${past.length})</summary>
      ${past.map(t => `<div class="sub" style="padding:4px 0;border-bottom:1px solid var(--border);">${t.status === "completed" ? "✓" : "✕"} ${esc(t.title)} — ${t.status} ${fmtDate((t.completedAt || t.updatedAt || "").slice(0, 10))}${rescheduleCount(t) ? ` · moved ×${rescheduleCount(t)}` : ""}</div>`).join("")}
    </details>` : ""}`;
}

/* ===================== INIT ===================== */
async function boot() {
  state = await loadState();
  if (serverEmptyNoCache) { showNoDataScreen(); return; }
  state.ui.view = "today"; // always open on today's follow-ups
  save(); // caches locally + (debounced) pushes to server
  if (needsInitialPush) { needsInitialPush = false; pushStateNow(); }
  render();
}
if (getToken()) {
  hideLogin();
  boot();
} else {
  showLogin();
}
</script>
