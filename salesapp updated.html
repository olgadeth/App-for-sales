<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>FieldSales CRM — Sharjah</title>
<style>/* ============================================================
   FIELDSALES — SHARJAH CRM + ROUTE + QUOTATIONS + ORDERS
   Extends the v2 CRM style with: item-row builders, activity feed,
   quote/order status pills, scrollable mobile tab bar, print helpers.
   ============================================================ */
:root{
  --navy:#0f172a; --navy-soft:#334155; --blue:#2563eb; --blue-dark:#1d4ed8; --blue-light:#eff6ff;
  --green:#16a34a; --green-light:#f0fdf4; --orange:#f97316; --orange-light:#fff7ed;
  --red:#dc2626; --red-light:#fef2f2; --purple:#9333ea; --purple-light:#faf5ff;
  --gray:#64748b; --gray-light:#f1f5f9; --border:#e2e8f0; --bg:#f8fafc; --white:#ffffff;
  --radius:12px; --shadow:0 1px 3px rgba(15,23,42,.08), 0 1px 2px rgba(15,23,42,.06);
  --shadow-md:0 4px 12px rgba(15,23,42,.10);
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;height:100%;}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  background:var(--bg); color:var(--navy); font-size:14px; line-height:1.5;}
h1,h2,h3,h4{margin:0 0 4px 0; color:var(--navy); font-weight:700;}
button{font-family:inherit; cursor:pointer;}
input,select,textarea{font-family:inherit; font-size:14px;}
a{color:var(--blue); text-decoration:none;}
::-webkit-scrollbar{width:8px;height:8px;}
::-webkit-scrollbar-thumb{background:#cbd5e1;border-radius:4px;}

#appShell{display:flex; min-height:100vh;}
.sidebar{width:222px; background:var(--white); border-right:1px solid var(--border); flex-shrink:0;
  padding:16px 12px; position:sticky; top:0; height:100vh; overflow-y:auto;}
.sidebar .brand{display:flex; align-items:center; gap:8px; padding:8px 8px 20px 8px;}
.sidebar .brand .logo{width:34px;height:34px;border-radius:9px;background:linear-gradient(135deg,var(--blue),var(--blue-dark));
  display:flex;align-items:center;justify-content:center;color:#fff;font-weight:800;font-size:15px;}
.sidebar .brand .name{font-size:13.5px;font-weight:700;color:var(--navy); line-height:1.2;}
.sidebar .brand .sub{font-size:11px;color:var(--gray);}
.navlist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:2px;}
.navitem{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:9px;color:var(--navy-soft);
  font-weight:600;font-size:13.5px;border:none;background:transparent;width:100%;text-align:left;}
.navitem:hover{background:var(--gray-light);}
.navitem.active{background:var(--blue-light); color:var(--blue-dark);}
.navitem .ic{font-size:16px;width:20px;text-align:center;}
.sidebar-foot{margin-top:20px;padding-top:14px;border-top:1px solid var(--border);font-size:11px;color:var(--gray);}

.main{flex:1; min-width:0; display:flex; flex-direction:column;}
.topbar{position:sticky; top:0; z-index:40; background:var(--white); border-bottom:1px solid var(--border);
  padding:10px 18px; display:flex; align-items:center; gap:12px; flex-wrap:wrap;}
.topbar .search-wrap{flex:1; min-width:180px; position:relative;}
.topbar input[type=search]{width:100%; padding:9px 12px 9px 34px; border-radius:9px; border:1px solid var(--border);
  background:var(--gray-light); font-size:13.5px;}
.topbar .search-wrap::before{content:"\1F50E"; position:absolute; left:10px; top:8px; font-size:13px;}
.qa-row{display:flex; gap:6px; flex-wrap:wrap;}
.content{padding:16px 18px 90px 18px; max-width:1400px; width:100%; margin:0 auto;}

.btn{border-radius:9px; border:1px solid var(--border); background:var(--white); color:var(--navy);
  padding:8px 13px; font-size:12.5px; font-weight:600; display:inline-flex; align-items:center; gap:6px; white-space:nowrap;}
.btn:hover{background:var(--gray-light);}
.btn-primary{background:var(--blue); border-color:var(--blue); color:#fff;}
.btn-primary:hover{background:var(--blue-dark);}
.btn-green{background:var(--green); border-color:var(--green); color:#fff;}
.btn-green:hover{background:#15803d;}
.btn-orange{background:var(--orange); border-color:var(--orange); color:#fff;}
.btn-red{background:var(--red); border-color:var(--red); color:#fff;}
.btn-ghost{background:transparent; border-color:transparent;}
.btn-sm{padding:5px 9px; font-size:11.5px; border-radius:7px;}
.btn:disabled{opacity:.45; cursor:not-allowed;}
.btn-block{width:100%; justify-content:center;}

.card{background:var(--white); border:1px solid var(--border); border-radius:var(--radius); box-shadow:var(--shadow); padding:16px;}
.section-title{font-size:15px; font-weight:800; margin-bottom:10px; display:flex; align-items:center; justify-content:space-between; gap:8px; flex-wrap:wrap;}
.section-title small{font-weight:500; color:var(--gray); font-size:11.5px;}

.banner-sample{background:var(--orange-light); border:1px solid #fed7aa; color:#9a3412; padding:9px 14px;
  border-radius:9px; font-size:12.5px; font-weight:600; margin-bottom:14px; display:flex; align-items:center; gap:8px;}

.kpi-grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(140px,1fr)); gap:10px; margin-bottom:16px;}
.kpi{background:var(--white); border:1px solid var(--border); border-radius:var(--radius); padding:13px; box-shadow:var(--shadow);}
.kpi .val{font-size:24px; font-weight:800; color:var(--navy);}
.kpi .lbl{font-size:11px; font-weight:700; color:var(--gray); text-transform:uppercase; letter-spacing:.03em; margin-top:2px;}
.kpi.blue .val{color:var(--blue);} .kpi.green .val{color:var(--green);} .kpi.orange .val{color:var(--orange);} .kpi.red .val{color:var(--red);} .kpi.purple .val{color:var(--purple);}

.grid-2{display:grid; grid-template-columns:1fr 1fr; gap:14px;}
.grid-3{display:grid; grid-template-columns:repeat(3,1fr); gap:14px;}
@media (max-width:900px){.grid-2,.grid-3{grid-template-columns:1fr;}}
.stack{display:flex; flex-direction:column; gap:14px;}

.plan-box{background:linear-gradient(135deg,var(--blue-light),#fff); border:1px solid #bfdbfe; border-radius:var(--radius); padding:16px; margin-bottom:16px;}
.plan-box h3{color:var(--blue-dark); font-size:14px;}
.plan-chips{display:flex; flex-wrap:wrap; gap:6px; margin-top:10px;}
.plan-chip{background:#fff; border:1px solid #bfdbfe; color:var(--blue-dark); font-size:12px; font-weight:600;
  padding:5px 6px 5px 10px; border-radius:99px; display:flex; align-items:center; gap:6px;}
.plan-chip button{background:none; border:none; color:var(--gray); font-weight:700; cursor:pointer; font-size:12px; padding:2px 4px;}

.pill{display:inline-flex; align-items:center; gap:4px; padding:3px 9px; border-radius:99px; font-size:11px; font-weight:700; white-space:nowrap;}
.pill-High{background:var(--red-light); color:var(--red);}
.pill-Medium{background:var(--orange-light); color:var(--orange);}
.pill-Low{background:var(--gray-light); color:var(--gray);}
.pill-Draft{background:var(--gray-light); color:var(--gray);}
.pill-Sent{background:var(--blue-light); color:var(--blue);}
.pill-Accepted{background:var(--green-light); color:var(--green);}
.pill-Rejected{background:var(--red-light); color:var(--red);}
.pill-Expired{background:var(--gray-light); color:var(--gray);}
.pill-Pending{background:var(--orange-light); color:var(--orange);}
.pill-Confirmed{background:var(--blue-light); color:var(--blue);}
.pill-Delivered{background:var(--green-light); color:var(--green);}
.pill-Cancelled{background:var(--red-light); color:var(--red);}
.status-pill{display:inline-flex;align-items:center;gap:4px;padding:3px 9px;border-radius:99px;font-size:11px;font-weight:700;}

.table-wrap{overflow-x:auto; border:1px solid var(--border); border-radius:var(--radius); background:#fff;}
table{width:100%; border-collapse:collapse; font-size:12.5px; min-width:980px;}
table.compact{min-width:760px;}
th{background:var(--gray-light); text-align:left; padding:9px 10px; font-weight:700; color:var(--navy-soft); font-size:11px; text-transform:uppercase; letter-spacing:.02em; position:sticky; top:0;}
td{padding:9px 10px; border-top:1px solid var(--border); vertical-align:middle;}
tr.fac-row:hover, tr.row-hover:hover{background:var(--blue-light);}
tr.fac-row.in-route{background:#f0fdf4;}
.fac-name{font-weight:700; color:var(--navy); cursor:pointer;}
.fac-name:hover{color:var(--blue);}
.sub{color:var(--gray); font-size:11px;}
.actions-cell{display:flex; gap:4px; flex-wrap:wrap;}

.filter-primary{display:flex; flex-wrap:wrap; gap:8px; align-items:center;}
.filter-primary-search{flex:1; min-width:180px; padding:9px 11px; border-radius:9px; border:1px solid var(--border); background:#fff; font-size:13px;}
.filter-primary-select{padding:9px 11px; border-radius:9px; border:1px solid var(--border); background:#fff; font-size:13px; font-weight:600; min-width:150px;}
.filter-bar{display:flex; flex-wrap:wrap; gap:8px; margin-top:10px; padding-top:10px; border-top:1px dashed var(--border); align-items:center;}
.filter-bar select, .filter-bar input{padding:7px 9px; border-radius:8px; border:1px solid var(--border); background:#fff; font-size:12.5px;}
@media (max-width:640px){ .filter-primary-select{min-width:0; flex:1;} }

#modalOverlay{position:fixed; inset:0; background:rgba(15,23,42,.55); display:none; align-items:flex-start; justify-content:center;
  padding:24px 12px; z-index:200; overflow-y:auto;}
#modalOverlay.open{display:flex;}
.modal{background:#fff; border-radius:14px; width:100%; max-width:680px; box-shadow:0 20px 50px rgba(0,0,0,.3); margin:auto 0;}
.modal-head{display:flex; align-items:center; justify-content:space-between; padding:14px 18px; border-bottom:1px solid var(--border);}
.modal-head h3{font-size:15px;}
.modal-head button{background:var(--gray-light); border:none; border-radius:8px; width:30px; height:30px; font-size:14px;}
.modal-body{padding:16px 18px; max-height:75vh; overflow-y:auto;}
.modal-foot{padding:12px 18px; border-top:1px solid var(--border); display:flex; justify-content:space-between; gap:8px; flex-wrap:wrap;}
.form-row{margin-bottom:11px;}
.form-row label{display:block; font-size:11.5px; font-weight:700; color:var(--navy-soft); margin-bottom:4px; text-transform:uppercase; letter-spacing:.02em;}
.form-row input, .form-row select, .form-row textarea{width:100%; padding:8px 10px; border-radius:8px; border:1px solid var(--border); background:#fff;}
.form-row textarea{min-height:60px; resize:vertical;}
.form-2col{display:grid; grid-template-columns:1fr 1fr; gap:10px;}
.form-3col{display:grid; grid-template-columns:1fr 1fr 1fr; gap:10px;}
@media (max-width:520px){.form-2col,.form-3col{grid-template-columns:1fr;}}
.tag-check{display:inline-flex; align-items:center; gap:5px; padding:5px 9px; border:1px solid var(--border); border-radius:99px; font-size:11.5px; margin:2px; background:#fff; cursor:pointer;}
.tag-check input{margin:0;}
.tag-wrap{display:flex; flex-wrap:wrap; margin:-2px;}

.timeline{border-left:2px solid var(--border); margin-left:8px; padding-left:16px;}
.tl-item{position:relative; padding-bottom:14px; cursor:pointer; border-radius:8px;}
.tl-item:hover{background:var(--gray-light);}
.tl-item::before{content:""; position:absolute; left:-21px; top:3px; width:10px; height:10px; border-radius:50%; background:var(--blue); border:2px solid #fff;}
.tl-date{font-size:11px; color:var(--gray); font-weight:700;}
.tl-type{font-size:13px; font-weight:700; margin:2px 0;}
.tl-actions{display:flex; gap:6px; margin-top:6px;}

.fu-bucket h4{font-size:13px; margin-bottom:8px; display:flex; align-items:center; gap:6px;}
.fu-item{background:#fff; border:1px solid var(--border); border-left:4px solid var(--blue); border-radius:9px; padding:10px 12px; margin-bottom:8px;}
.fu-item.overdue{border-left-color:var(--red);}
.fu-item.today{border-left-color:var(--orange);}

.funnel{display:flex; flex-direction:column; gap:4px; margin-top:8px;}
.funnel-row{display:flex; align-items:center; gap:10px;}
.funnel-bar{height:30px; background:linear-gradient(90deg,var(--blue),var(--blue-dark)); border-radius:6px; display:flex; align-items:center; color:#fff; font-weight:700; font-size:12px; padding:0 10px; min-width:34px;}
.funnel-label{width:150px; font-size:12px; font-weight:600; color:var(--navy-soft); flex-shrink:0;}

.coverage-item{padding:10px 0; border-bottom:1px solid var(--border);}
.coverage-item:last-child{border-bottom:none;}
.coverage-top{display:flex; justify-content:space-between; font-size:12.5px; font-weight:700; margin-bottom:5px;}
.progress-bg{height:9px; background:var(--gray-light); border-radius:99px; overflow:hidden;}
.progress-fg{height:100%; background:var(--blue); border-radius:99px;}

.chart-box{background:#fff; border:1px solid var(--border); border-radius:var(--radius); padding:14px; box-shadow:var(--shadow);}
.bar-chart{display:flex; align-items:flex-end; gap:6px; height:130px; padding-top:6px; border-bottom:1px solid var(--border);}
.bar-chart .bar-col{flex:1; display:flex; flex-direction:column; align-items:center; justify-content:flex-end; height:100%;}
.bar-chart .bar{width:100%; max-width:26px; background:var(--blue); border-radius:4px 4px 0 0;}
.bar-chart .bar-label{font-size:9.5px; color:var(--gray); margin-top:4px;}
.bar-chart .bar-val{font-size:10px; color:var(--navy-soft); margin-bottom:2px; font-weight:700;}

/* ---- Activity feed (Dashboard) ---- */
.activity-item{display:flex; gap:10px; padding:10px 0; border-top:1px solid var(--border);}
.activity-item:first-child{border-top:none;}
.activity-dot{width:8px; height:8px; border-radius:50%; background:var(--blue); margin-top:6px; flex-shrink:0;}
.activity-body{flex:1; min-width:0;}
.activity-top{display:flex; justify-content:space-between; gap:8px; font-size:12.5px; font-weight:700;}
.activity-when{color:var(--gray); font-weight:600; font-size:11px; white-space:nowrap;}
.activity-meta{font-size:11.5px; color:var(--navy-soft); margin-top:2px;}
.activity-notes{font-size:11.5px; color:var(--gray); margin-top:2px;}

/* ---- Item-row builder (quotations / orders) ---- */
.items-container{display:flex; flex-direction:column; gap:6px; margin-top:4px;}
.item-row{display:grid; grid-template-columns:2fr 70px 1.4fr 30px; gap:6px; align-items:center;}
.item-row input{padding:7px 8px; border-radius:7px; border:1px solid var(--border); font-size:12.5px;}
.item-row button{width:28px; height:28px; padding:0; display:flex; align-items:center; justify-content:center; border-radius:7px;}
@media (max-width:560px){.item-row{grid-template-columns:1fr 56px 30px; grid-template-areas:"p q x" "n n n";} .item-row input:nth-child(1){grid-area:p;} .item-row input:nth-child(2){grid-area:q;} .item-row input:nth-child(3){grid-area:n;} .item-row button{grid-area:x;}}

/* ---- Bottom nav (mobile) — horizontal scroll to fit more tabs ---- */
.bottomnav{display:none; position:fixed; bottom:0; left:0; right:0; background:#fff; border-top:1px solid var(--border);
  z-index:60; padding:4px 2px calc(4px + env(safe-area-inset-bottom)) 2px; overflow-x:auto;}
.bottomnav .navlist{flex-direction:row; justify-content:flex-start; gap:0;}
.bottomnav .navitem{flex-direction:column; gap:2px; font-size:9.5px; padding:6px 10px; flex:0 0 auto; align-items:center; min-width:62px;}
.bottomnav .navitem .ic{font-size:18px;}

.view{display:none;}
.view.active{display:block;}
.empty-state{text-align:center; padding:30px 10px; color:var(--gray); font-size:13px;}
.load-more{margin:12px 0;}

@media (max-width:980px){
  .sidebar{display:none;}
  .content{padding:12px 12px 90px 12px;}
  .bottomnav{display:block;}
  .form-2col,.form-3col{grid-template-columns:1fr;}
  table{min-width:760px;}
}

/* ---- sales insights ---- */
.trend-pill{display:inline-flex;align-items:center;padding:3px 9px;border-radius:99px;font-size:11px;font-weight:700;}
.t-good{background:var(--green-light);color:var(--green);} .t-ok{background:var(--blue-light);color:var(--blue);}
.t-warn{background:var(--orange-light);color:var(--orange);} .t-bad{background:var(--red-light);color:var(--red);}
.wb-item{border:1px solid var(--border);border-radius:10px;padding:10px 12px;margin-bottom:8px;background:#fff;}
.wb-item.wb-credit{border-color:#fecaca;background:var(--red-light);}
.wb-action{margin-top:4px;font-size:12px;font-weight:600;color:var(--navy-soft);}
.insight-box{border:1px solid #bfdbfe;background:var(--blue-light);border-radius:10px;padding:10px 12px;margin:0 0 12px 0;}
.st-head{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:8px;}
.st-big{font-size:22px;font-weight:800;}
.st-legend{display:flex;gap:12px;font-size:11.5px;color:var(--gray);align-items:center;flex-wrap:wrap;}
.st-legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:4px;vertical-align:middle;}
i.st-prev,.st-bar .st-prev{background:#94a3b8;} i.st-you,.st-bar .st-you{background:var(--blue);}
i.st-tline{background:none;border-top:2px dashed var(--red);height:0;border-radius:0;width:14px;}
.st-plot{position:relative;display:flex;align-items:flex-end;gap:8px;padding-top:16px;box-sizing:content-box;}
.st-col{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:stretch;height:100%;min-width:0;}
.st-val{font-size:10px;color:var(--gray);text-align:center;height:14px;line-height:14px;}
.st-bar{display:flex;flex-direction:column;justify-content:flex-end;}
.st-target{position:absolute;left:0;right:0;border-top:2px dashed var(--red);pointer-events:none;}
.st-labels{display:flex;gap:8px;margin-top:4px;}
.st-labels div{flex:1;text-align:center;font-size:10.5px;color:var(--gray);}

/* ---- Today / follow-up engine (mobile-first) ---- */
.today-head{display:flex;justify-content:space-between;align-items:flex-end;margin-bottom:10px;}
.today-date{font-size:20px;font-weight:800;}
.big-actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px;}
.big-btn{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;min-height:74px;border-radius:14px;border:1px solid var(--border);background:#fff;font-size:15px;font-weight:700;color:var(--navy);box-shadow:var(--shadow);}
.big-btn span{font-size:24px;line-height:1;}
.big-btn.primary{background:var(--blue);border-color:var(--blue);color:#fff;}
.today-counters{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:14px;}
.ctr{border:1px solid var(--border);background:#fff;border-radius:12px;padding:8px 4px;font-size:11.5px;color:var(--gray);display:flex;flex-direction:column;align-items:center;}
.ctr b{font-size:20px;color:var(--navy);}
.ctr-red{background:var(--red-light);border-color:#fecaca;} .ctr-red b{color:var(--red);}
.ctr-orange{background:var(--orange-light);border-color:#fed7aa;} .ctr-orange b{color:var(--orange);}
.triage-tip{background:#fffbeb;border:1px solid #fde68a;border-radius:10px;padding:10px 12px;font-size:13px;margin-bottom:12px;}
.today-sec{margin-bottom:16px;}
.today-sec-head{display:flex;justify-content:space-between;align-items:center;gap:8px;margin:0 0 8px 0;}
.today-sec-head h3{font-size:15px;margin:0;}
.today-sec-head .count{display:inline-block;min-width:22px;padding:1px 7px;border-radius:99px;background:var(--gray-light);font-size:12px;text-align:center;color:var(--navy-soft);}
.task-card{display:flex;gap:8px;background:#fff;border:1px solid var(--border);border-left:5px solid var(--border);border-radius:12px;padding:10px 12px;margin-bottom:8px;box-shadow:var(--shadow);}
.task-card.tb-overdue{border-left-color:var(--red);} .task-card.tb-today{border-left-color:var(--orange);}
.task-card.tb-tomorrow{border-left-color:#eab308;} .task-card.tb-week{border-left-color:var(--blue);}
.task-card.task-done{opacity:.75;border-left-color:var(--green);}
.task-sel{display:flex;align-items:flex-start;padding-top:2px;} .task-sel input{width:22px;height:22px;}
.task-main{flex:1;min-width:0;}
.task-top{display:flex;justify-content:space-between;gap:8px;align-items:baseline;}
.task-fac{font-weight:700;color:var(--blue-dark);cursor:pointer;}
.task-due{font-size:12px;font-weight:700;color:var(--gray);white-space:nowrap;}
.tb-overdue .task-due{color:var(--red);} .tb-today .task-due{color:var(--orange);}
.task-title{margin-top:2px;font-size:14px;}
.task-meta{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-top:4px;font-size:11.5px;color:var(--gray);}
.src-pill{background:var(--gray-light);border-radius:99px;padding:1px 8px;font-size:11px;color:var(--navy-soft);}
.task-last{font-size:12px;color:var(--gray);margin-top:4px;}
.task-actions{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px;}
.task-actions .btn{min-height:38px;display:inline-flex;align-items:center;}
.btn-done{background:var(--green);color:#fff;border-color:var(--green);font-weight:700;padding:8px 16px;}

<body>
<div id="loginScreen" style="display:flex;min-height:100vh;align-items:center;justify-content:center;background:#f8fafc;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;">
  <div style="background:#fff;border:1px solid #e2e8f0;border-radius:14px;box-shadow:0 4px 12px rgba(15,23,42,.1);padding:28px;width:100%;max-width:320px;">
    <h2 style="margin:0 0 4px 0;font-size:18px;color:#0f172a;">FieldSales CRM</h2>
    <p style="margin:0 0 16px 0;font-size:12.5px;color:#64748b;">Sign in to sync your data across devices.</p>
    <input id="loginPassword" type="password" placeholder="Password" style="width:100%;padding:10px 12px;border-radius:9px;border:1px solid #e2e8f0;font-size:14px;margin-bottom:10px;box-sizing:border-box;">
    <button id="loginBtn" style="width:100%;padding:10px;border-radius:9px;border:none;background:#2563eb;color:#fff;font-weight:700;font-size:14px;cursor:pointer;">Sign in</button>
    <div id="loginError" style="color:#dc2626;font-size:12px;margin-top:10px;display:none;"></div>
  </div>
</div>
<div id="app" style="display:none;"></div>
<div id="syncBadge" style="position:fixed;bottom:10px;right:10px;font-size:11px;padding:5px 10px;border-radius:99px;background:#f1f5f9;color:#64748b;display:none;z-index:999;">Saved locally — will sync when online</div>
<script>
/* ---------------- API / auth / sync layer ---------------- */
const TOKEN_KEY = "fieldSalesCRM_token";
function getToken() { return localStorage.getItem(TOKEN_KEY); }
function setToken(t) { localStorage.setItem(TOKEN_KEY, t); }
function clearToken() { localStorage.removeItem(TOKEN_KEY); }

async function apiLogin(password) {
  const res = await fetch("/api/login", {
    method: "POST", headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ password })
  });
  if (!res.ok) throw new Error("Wrong password");
  const { token } = await res.json();
  setToken(token);
}
async function apiFetchState() {
  const res = await fetch("/api/state", { headers: { Authorization: "Bearer " + getToken() } });
  if (res.status === 401) { clearToken(); showLogin(); throw new Error("Auth expired"); }
  if (!res.ok) throw new Error("Failed to load from server");
  return res.json(); // { data, updatedAt }
}
/* ---------------- sync with conflict protection ----------------
   - Every edit is saved to this phone first (localStorage), then sent to the server.
   - "dirty" = there are edits on this device the server hasn't confirmed yet.
   - We remember the last copy both sides agreed on ("base"). If the server copy changed
     in the meantime (edits from another device), the server answers 409 and we do a
     3-way merge: changes from BOTH devices are kept, item by item (facilities, visits,
     follow-ups, quotations, orders). Nothing is silently overwritten. */
const SERVER_TS_KEY = "fieldSalesCRM_serverUpdatedAt";
const DIRTY_KEY = "fieldSalesCRM_dirty";
const BASE_KEY = "fieldSalesCRM_base";
let pushTimer = null, pushInFlight = false, pushQueued = false;
let editCounter = 0, pendingSaveReason = "", baseMemory = null, syncState = "idle", syncError = "";

function lsGet(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }
function lsSet(k, v) { try { localStorage.setItem(k, v); return true; } catch (e) { return false; } }
function lsDel(k) { try { localStorage.removeItem(k); } catch (e) {} }
function isDirty() { return lsGet(DIRTY_KEY) === "1"; }
function markDirty() { lsSet(DIRTY_KEY, "1"); editCounter++; }
function setBase(str) { baseMemory = str; if (!lsSet(BASE_KEY, str)) lsDel(BASE_KEY); }
function getBase() {
  const s = baseMemory || lsGet(BASE_KEY);
  if (!s) return null;
  try { return JSON.parse(s); } catch (e) { return null; }
}

function setSyncState(s, err) {
  syncState = s; syncError = err || "";
  const badge = document.getElementById("syncBadge");
  if (badge) {
    const map = {
      offline: ["Not synced — saved on this phone, will sync when online", "#fff7ed", "#c2410c"],
      blocked: ["Not synced — " + syncError, "#fef2f2", "#b91c1c"],
      merged: ["Merged with changes from another device", "#eff6ff", "#1d4ed8"]
    };
    const m = map[s];
    if (m) { badge.textContent = m[0]; badge.style.background = m[1]; badge.style.color = m[2]; badge.style.display = "block"; }
    else badge.style.display = "none";
    if (s === "merged") setTimeout(() => { if (syncState === "merged") setSyncState("idle"); }, 4000);
  }
  const line = document.getElementById("syncLine");
  if (line) line.innerHTML = syncLineHtml();
}
function syncLineHtml() {
  if (syncState === "offline") return '<span style="color:#c2410c;">● Not synced (offline) — saved on this phone</span>';
  if (syncState === "blocked") return '<span style="color:#b91c1c;">● Not synced — ' + (syncError || "error") + '</span>';
  if (syncState === "saving" || isDirty()) return '<span style="color:#64748b;">● Saving…</span>';
  return '<span style="color:#16a34a;">● Synced</span>';
}

/* ---------- 3-way merge ---------- */
function eqJ(a, b) { return JSON.stringify(a) === JSON.stringify(b); }
function merge3(baseArr, localArr, serverArr, keyFn, mergeItem) {
  keyFn = keyFn || (x => x && x.id);
  const mB = new Map((baseArr || []).map(x => [keyFn(x), x]));
  const mL = new Map((localArr || []).map(x => [keyFn(x), x]));
  const mS = new Map((serverArr || []).map(x => [keyFn(x), x]));
  const order = [...(serverArr || []).map(keyFn), ...(localArr || []).map(keyFn).filter(k => !mS.has(k))];
  const out = [];
  order.forEach(k => {
    const b = mB.get(k), l = mL.get(k), s = mS.get(k);
    if (l && s) {
      if (b && eqJ(l, b)) out.push(s);            // only the server changed it
      else if (b && eqJ(s, b)) out.push(l);       // only this device changed it
      else if (eqJ(l, s)) out.push(l);
      else out.push(mergeItem ? mergeItem(b, l, s) : l); // both changed: this device wins field-wise
    } else if (l && !s) {
      if (b && eqJ(l, b)) return;                 // deleted on the other device
      out.push(l);                                // new (or edited) here
    } else if (!l && s) {
      if (b && eqJ(s, b)) return;                 // deleted on this device
      out.push(s);                                // new (or edited) on the other device
    }
  });
  return out;
}
function mergeRecord(b, l, s) {
  const out = Object.assign({}, s, l);
  out.visits = merge3(b && b.visits, l.visits, s.visits);
  // keep roll-ups consistent with the merged visit history
  const sorted = (out.visits || []).slice().sort((x, y) => (y.date + (y.time || "")).localeCompare(x.date + (x.time || "")));
  if (sorted.length) { out.lastVisit = sorted[0].date; }
  return out;
}
function mergeTask(b, l, s) {
  // the more recently updated copy wins; history entries from both are kept
  const winner = (l.updatedAt || "") >= (s.updatedAt || "") ? l : s;
  const out = Object.assign({}, winner);
  const seen = new Set(); out.history = [];
  [...(s.history || []), ...(l.history || [])].forEach(h => { const k = JSON.stringify(h); if (!seen.has(k)) { seen.add(k); out.history.push(h); } });
  out.history.sort((x, y) => (x.at || "").localeCompare(y.at || ""));
  return out;
}
function mergeStates(base, local, server) {
  // normalise both sides the same way first, so formatting-only differences don't count as edits
  const clone = (x) => JSON.parse(JSON.stringify(x));
  base = base ? normalize(clone(base)) : {};
  server = normalize(clone(server));
  const pick = (k) => (base[k] !== undefined && eqJ(local[k], base[k])) ? server[k] : local[k];
  const out = Object.assign({}, server);
  out.records = merge3(base.records, local.records, server.records, null, mergeRecord);
  out.quotations = merge3(base.quotations, local.quotations, server.quotations);
  out.orders = merge3(base.orders, local.orders, server.orders);
  out.tasks = merge3(base.tasks, local.tasks, server.tasks, null, mergeTask);
  out.products = [...new Set([...(server.products || []), ...(local.products || [])])];
  out.quotationSeq = Math.max(local.quotationSeq || 0, server.quotationSeq || 0);
  out.orderSeq = Math.max(local.orderSeq || 0, server.orderSeq || 0);
  ["zoneNames", "profile", "salesInsights", "settings"].forEach(k => { if (local[k] !== undefined || server[k] !== undefined) out[k] = pick(k); });
  out.route = local.route; out.ui = local.ui; // per-device things
  out.tasksMigrated = local.tasksMigrated || server.tasksMigrated;
  return out;
}

function schedulePush() {
  if (pushTimer) clearTimeout(pushTimer);
  pushTimer = setTimeout(pushStateNow, 800); // debounce rapid edits
}
async function pushStateNow() {
  if (!getToken() || !state) return;
  if (pushInFlight) { pushQueued = true; return; }
  pushInFlight = true;
  setSyncState("saving");
  const sentAt = editCounter;
  const body = JSON.stringify(state);
  const reason = pendingSaveReason; pendingSaveReason = "";
  const headers = { "Content-Type": "application/json", Authorization: "Bearer " + getToken() };
  const baseTs = lsGet(SERVER_TS_KEY);
  if (baseTs && reason !== "restore" && reason !== "reset") headers["X-Base-Updated-At"] = baseTs;
  if (reason) headers["X-Save-Reason"] = reason;
  try {
    const res = await fetch("/api/state", { method: "PUT", headers, body });
    if (res.status === 401) { clearToken(); showLogin(); return; }
    if (res.status === 409) {
      const { data: serverData, updatedAt } = await res.json();
      const merged = mergeStates(getBase(), JSON.parse(JSON.stringify(state)), serverData);
      state = normalize(merged);
      lsSet(SERVER_TS_KEY, updatedAt);
      setBase(JSON.stringify(serverData));
      lsSet(STORAGE_KEY, JSON.stringify(state));
      pushQueued = true;
      setSyncState("merged");
      refreshAfterRemoteChange();
      return;
    }
    if (!res.ok) {
      let msg = "server error " + res.status;
      try { const j = await res.json(); if (j.error) msg = j.error; } catch (e) {}
      setSyncState("blocked", msg);
      return;
    }
    const { updatedAt } = await res.json();
    lsSet(SERVER_TS_KEY, updatedAt);
    setBase(body);
    if (editCounter === sentAt) lsDel(DIRTY_KEY);
    setSyncState("idle");
  } catch (e) {
    setSyncState("offline"); // saved locally, will retry
    setTimeout(() => { if (isDirty()) schedulePush(); }, 30000);
  } finally {
    pushInFlight = false;
    if (pushQueued) { pushQueued = false; schedulePush(); }
  }
}
// Re-render after data changed underneath us, without destroying an open form.
function refreshAfterRemoteChange() {
  if (typeof renderContent !== "function" || !document.getElementById("content")) return;
  const overlay = document.getElementById("modalOverlay");
  if (overlay && overlay.classList.contains("open")) return; // don't wipe what you're typing
  renderContent();
}
// When the app comes back to the foreground: send pending edits, or pull edits made on another device.
document.addEventListener("visibilitychange", async () => {
  if (document.visibilityState !== "visible" || !getToken() || !state) return;
  if (isDirty()) { schedulePush(); return; }
  try {
    const { data, updatedAt } = await apiFetchState();
    if (data && updatedAt && updatedAt !== lsGet(SERVER_TS_KEY) && !isDirty()) {
      state = normalize(Object.assign(data, { ui: state.ui, route: state.route }));
      lsSet(SERVER_TS_KEY, updatedAt); setBase(JSON.stringify(data));
      lsSet(STORAGE_KEY, JSON.stringify(state));
      refreshAfterRemoteChange();
    }
  } catch (e) {}
});
window.addEventListener("online", () => { if (isDirty()) schedulePush(); });

function showLogin() {
  document.getElementById("loginScreen").style.display = "flex";
  document.getElementById("app").style.display = "none";
}
function hideLogin() {
  document.getElementById("loginScreen").style.display = "none";
  document.getElementById("app").style.display = "";
}
document.getElementById("loginBtn").addEventListener("click", doLogin);
document.getElementById("loginPassword").addEventListener("keydown", e => { if (e.key === "Enter") doLogin(); });
async function doLogin() {
  const pw = document.getElementById("loginPassword").value;
  const errEl = document.getElementById("loginError");
  errEl.style.display = "none";
  try {
    await apiLogin(pw);
    hideLogin();
    await boot();
  } catch (e) {
    errEl.textContent = "Incorrect password. Try again.";
    errEl.style.display = "block";
  }
}
</script>

  { key: "not_visited", label: "Not Visited", color: "#dc2626", bg: "#fef2f2" },
  { key: "contacted", label: "Contacted", color: "#ca8a04", bg: "#fefce8" },

let state = null;

/* ---------------- id / time helpers ---------------- */
function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 8); }
function pad(n) { return n < 10 ? "0" + n : "" + n; }
// All "today"/"now" logic uses UAE time (Asia/Dubai), whatever the device clock zone is set to.
const APP_TZ = "Asia/Dubai";
function tzParts() {
  const p = {}; new Intl.DateTimeFormat("en-GB", { timeZone: APP_TZ, year: "numeric", month: "2-digit", day: "2-digit", hour: "2-digit", minute: "2-digit", hour12: false })
    .formatToParts(new Date()).forEach(x => { p[x.type] = x.value; });
  if (p.hour === "24") p.hour = "00";
  return p;
}
function todayStr() { const p = tzParts(); return p.year + "-" + p.month + "-" + p.day; }
function nowTime() { const p = tzParts(); return p.hour + ":" + p.minute; }
function nowIso() { return new Date().toISOString(); }
function daysDiff(a, b) { const da = new Date(a + "T00:00:00"), db = new Date(b + "T00:00:00"); return Math.round((db - da) / 86400000); }
function fmtDate(s) { if (!s) return "—"; const d = new Date(s + "T00:00:00"); return d.toLocaleDateString("en-GB", { day: "2-digit", month: "short", year: "numeric" }); }
function fmtTime(t) { return t ? t : "—"; }
function fmtDateTime(s, t) { return fmtDate(s) + (t ? " · " + t : ""); }
function addDays(s, n) { const d = new Date(s + "T00:00:00"); d.setDate(d.getDate() + n); return d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate()); }

/* ---------------- persistence ----------------
   Local copy in localStorage = instant load + offline safety net.
   Server (SQLite via our Node/Express API) = the copy every device reads from,
   which is what makes the data show up on your phone AND your laptop. */
function localCache() {
  let raw = null;
  try { raw = localStorage.getItem(STORAGE_KEY); } catch (e) {}
  if (raw) { try { return JSON.parse(raw); } catch (e) {} }
  return null;
}
function seedState() {
  const records = SEED.records.map(r => Object.assign({
    contactRole: "", purchasingMethod: "Unknown", notes: ""
  }, r));
  return normalize({ zoneNames: SEED.zoneNames, records, route: null });
}
let needsInitialPush = false, serverEmptyNoCache = false;
async function loadState() {
  // 1) show something instantly from the local cache (or seed data) while we check the server
  const cached = localCache();
  let working = cached ? normalize(cached) : seedState();
  // 2) try to pull the authoritative copy from the server
  try {
    const { data, updatedAt } = await apiFetchState();
    if (data && Array.isArray(data.records) && data.records.length) {
      if (cached && isDirty()) {
        // this phone has edits the server never received (e.g. made offline) — keep both
        working = normalize(mergeStates(getBase(), working, data));
        needsInitialPush = true;
      } else {
        working = normalize(Object.assign(data, { ui: working.ui }));
      }
      if (updatedAt) lsSet(SERVER_TS_KEY, updatedAt);
      setBase(JSON.stringify(data));
    } else {
      // The server has no data. On Render's free plan this happens whenever the service
      // restarts or sleeps (its disk is wiped). If THIS device has your data, re-upload it.
      // If it doesn't (new phone / cleared browser), never upload the default list over
      // your real data — ask what to do instead.
      if (cached) needsInitialPush = true;
      else serverEmptyNoCache = true;
    }
  } catch (e) {
    // offline or server unreachable — keep using the local cache we already loaded
  }
  return working;
}
function normalize(s) {
  s.route = s.route || { date: todayStr(), ids: [] };
  if (s.route.date !== todayStr()) s.route = { date: todayStr(), ids: [] };
  s.quotations = s.quotations || [];
  s.orders = s.orders || [];
  s.products = s.products || [];
  s.profile = Object.assign({ repName: "", company: "", phone: "", email: "" }, s.profile || {});
  s.quotationSeq = s.quotationSeq || 0;
  s.orderSeq = s.orderSeq || 0;
  if (s.salesInsights === undefined) s.salesInsights = null;
  s.ui = s.ui || {};
  s.ui = Object.assign({
    view: "dashboard", search: "", zone: "", area: "", type: "", priority: "", status: "",
    onlyDue: false, sort: "priority", limit: 60,
    quoteStatus: "", quoteSearch: "", quoteLimit: 60,
    orderStatus: "", orderSearch: "", orderLimit: 60,
    reportDate: todayStr()
  }, s.ui);
  s.records.forEach(r => {
    if (r.contactRole == null) r.contactRole = "";
    if (r.purchasingMethod == null) r.purchasingMethod = "Unknown";
    if (r.notes == null) r.notes = "";
    (r.visits || []).forEach(v => { if (!v.id) v.id = uid(); if (v.time == null) v.time = ""; });
  });
  s.quotations.forEach(q => { if (!q.items) q.items = []; if (!q.attachments) q.attachments = []; });
  s.orders.forEach(o => { if (!o.items) o.items = []; if (!o.attachments) o.attachments = []; });
  s.tasks = Array.isArray(s.tasks) ? s.tasks : [];
  s.tasks.forEach(t => { if (!t.history) t.history = []; });
  if (!s.tasksMigrated) migrateFollowUpsToTasks(s);
  return s;
}
function save(reason) {
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); } catch (e) {}
  markDirty();
  if (reason) pendingSaveReason = reason;
  schedulePush(); // sends the update to the server (debounced) so other devices see it too
}
// UI-only changes (which tab is open, filters) — kept on this phone, still synced lazily.
function saveUi() { try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); } catch (e) {} }

/* ---------------- due logic ---------------- */
function computeDue(rec) {
  if (!rec.lastVisit) return { due: true, overdue: Infinity, label: "Never visited", cls: "red" };
  const target = REVISIT_DAYS[rec.priority] || 30;
  const since = daysDiff(rec.lastVisit, todayStr());
  const overdue = since - target;
  if (overdue >= 0) return { due: true, overdue, label: overdue === 0 ? "Due today" : `Overdue ${overdue}d`, cls: overdue > 7 ? "red" : "orange" };
  return { due: false, overdue, label: `Due in ${-overdue}d`, cls: "green" };
}
function followUpInfo(rec) {
  if (!rec.nextFollowUp) return null;
  const diff = daysDiff(todayStr(), rec.nextFollowUp);
  if (diff < 0) return { label: `Overdue ${-diff}d`, cls: "overdue" };
  if (diff === 0) return { label: "Today", cls: "today" };
  return { label: `In ${diff}d`, cls: "" };
}
function statusMeta(key) { return STATUSES.find(s => s.key === key) || STATUSES[0]; }
function esc(s) { return (s == null ? "" : String(s)).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c])); }
function getRec(id) { return state.records.find(r => r.id === id); }
function zoneName(z) { return state.zoneNames[z - 1] || ("Zone " + z); }

/* ===================== DASHBOARD ===================== */
function allVisitsFlat() {
  const out = [];
  state.records.forEach(r => r.visits.forEach(v => out.push(Object.assign({ facilityId: r.id, facilityName: r.name, facilityArea: r.area }, v))));
  return out;
}
function viewDashboard() {
  const all = state.records;
  const now = todayStr();
  const dueCount = all.filter(r => computeDue(r).due).length;
  const customers = all.filter(r => r.status === "customer").length;
  const weekAhead = addDays(now, 7);
  const fuWeek = all.filter(r => r.nextFollowUp && r.nextFollowUp >= now && r.nextFollowUp <= weekAhead).length;
  const allVisits = allVisitsFlat();
  const weekAgo = addDays(now, -6);
  const visitsWeek = allVisits.filter(v => v.date >= weekAgo && v.date <= now).length;
  const ordersMonthPrefix = now.slice(0, 7);
  const ordersMonth = state.orders.filter(o => o.date && o.date.slice(0, 7) === ordersMonthPrefix).length;
  const quotesOpen = state.quotations.filter(q => q.status === "Draft" || q.status === "Sent").length;

  const routeItems = state.route.ids.map(getRec).filter(Boolean);

  const weeks = [];
  for (let i = 7; i >= 0; i--) {

    weeks.push({ label: end.slice(5), count: allVisits.filter(v => v.date >= start && v.date <= end).length });
  }
  const maxWeek = Math.max(1, ...weeks.map(w => w.count));

  const recent = allVisits.slice().sort((a, b) => (b.date + (b.time || "")).localeCompare(a.date + (a.time || ""))).slice(0, 15);

  return `

    </div>

    <div class="kpi-grid">
      <div class="kpi blue"><div class="val">${all.length}</div><div class="lbl">Total facilities</div></div>
      <div class="kpi green"><div class="val">${customers}</div><div class="lbl">Customers</div></div>
      <div class="kpi red"><div class="val">${dueCount}</div><div class="lbl">Due / overdue</div></div>
      <div class="kpi orange"><div class="val">${fuWeek}</div><div class="lbl">Follow-ups this wk</div></div>
      <div class="kpi purple"><div class="val">${visitsWeek}</div><div class="lbl">Visits this week</div></div>
      <div class="kpi blue"><div class="val">${ordersMonth}</div><div class="lbl">Orders this month</div></div>
      <div class="kpi orange"><div class="val">${quotesOpen}</div><div class="lbl">Open quotations</div></div>
    </div>

    ${salesTrendCardHtml()}

    <div class="grid-2">
      <div class="card">
        <div class="section-title">Sales Funnel <small>Furthest stage reached, all facilities</small></div>
        <div class="funnel">
          ${FUNNEL_STAGES.map(stage => {
            const count = stage.set ? all.filter(r => stage.set.includes(r.status)).length : all.length;
            const pct = all.length ? Math.max(6, Math.round((count / all.length) * 100)) : 0;
            return `<div class="funnel-row"><div class="funnel-label">${stage.label}</div><div class="funnel-bar" style="width:${pct}%">${count}</div></div>`;
          }).join("")}
        </div>
      </div>
      <div class="chart-box">
        <h4>Visits per week (last 8 weeks)</h4>
        <div class="bar-chart">
          ${weeks.map(w => `<div class="bar-col"><div class="bar-val">${w.count || ""}</div><div class="bar" style="height:${w.count ? Math.max(4, (w.count / maxWeek) * 96) : 2}px"></div><div class="bar-label">${w.label}</div></div>`).join("")}
        </div>
      </div>
    </div>

    <div class="card" style="margin-top:14px;">
      <div class="section-title">Recent activity <small>Who you contacted, and what was discussed</small></div>
      ${recent.length ? recent.map(v => `
        <div class="activity-item">
          <div class="activity-dot"></div>
          <div class="activity-body">
            <div class="activity-top"><span onclick="openDetail(${v.facilityId})" style="cursor:pointer;">${esc(v.facilityName)}</span><span class="activity-when">${fmtDateTime(v.date, v.time)}</span></div>

/* ===================== FACILITIES & ROUTE (merged) ===================== */
function filteredRecords() {
  let list = state.records.slice();
  const ui = state.ui;
  if (ui.search) {
    const q = ui.search.toLowerCase();
    list = list.filter(r => r.name.toLowerCase().includes(q) || r.area.toLowerCase().includes(q) || (r.contactPerson || "").toLowerCase().includes(q) || (r.phone || "").includes(q));
  }
  if (ui.zone) list = list.filter(r => r.zone == ui.zone);
  if (ui.area) list = list.filter(r => r.area === ui.area);
  if (ui.type) list = list.filter(r => r.type === ui.type);
  if (ui.priority) list = list.filter(r => r.priority === ui.priority);
  if (ui.status) list = list.filter(r => r.status === ui.status);
  if (ui.onlyDue) list = list.filter(r => computeDue(r).due);
  const sort = ui.sort;
  const prioRank = { High: 0, Medium: 1, Low: 2 };
  list.sort((a, b) => {
    if (sort === "priority") return prioRank[a.priority] - prioRank[b.priority] || a.name.localeCompare(b.name);
    if (sort === "name") return a.name.localeCompare(b.name);
    if (sort === "area") return a.area.localeCompare(b.area) || a.name.localeCompare(b.name);
    if (sort === "zone") return a.zone - b.zone || a.name.localeCompare(b.name);
    if (sort === "lastVisit") return (a.lastVisit || "") < (b.lastVisit || "") ? 1 : -1;
    if (sort === "followup") return (a.nextFollowUp || "9999") < (b.nextFollowUp || "9999") ? -1 : 1;
    if (sort === "due") { const da = computeDue(a).overdue, db = computeDue(b).overdue; return db - da; }
    return 0;
  });
  return list;
}

function facRow(r) {
  const d = computeDue(r);
  const fu = followUpInfo(r);
  const sm = statusMeta(r.status);
  const inRoute = state.route.ids.includes(r.id);
  return `
    <tr class="fac-row ${inRoute ? "in-route" : ""}">
      <td><div class="fac-name" onclick="openDetail(${r.id})">${esc(r.name)}</div><div class="sub">${esc(r.phone || "No phone on file")}</div></td>

function suggestRoute() {
  const due = filteredRecords().filter(r => computeDue(r).due && !state.route.ids.includes(r.id));
  due.sort((a, b) => { const oa = computeDue(a).overdue, ob = computeDue(b).overdue; if (oa === Infinity && ob === Infinity) return 0; if (oa === Infinity) return -1; if (ob === Infinity) return 1; return ob - oa; });

/* ===================== ATTACHMENTS (PDF quotes/orders, photos) ===================== */
let modalAttachments = []; // working list while a quote/order modal is open: [{id, filename, mimetype, size}]

function fmtFileSize(bytes) {
  if (bytes == null) return "";
  if (bytes < 1024) return bytes + " B";
  if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(0) + " KB";
  return (bytes / (1024 * 1024)).toFixed(1) + " MB";
}
function fileIcon(mimetype) {
  if ((mimetype || "").startsWith("image/")) return "🖼️";
  if (mimetype === "application/pdf") return "📄";
  return "📎";
}
function readFileAsBase64(file) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = () => resolve(reader.result.split(",")[1]); // strip the data:...;base64, prefix
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}
async function apiUploadFile(file) {
  const dataBase64 = await readFileAsBase64(file);
  const res = await fetch("/api/files", {
    method: "POST",
    headers: { "Content-Type": "application/json", Authorization: "Bearer " + getToken() },
    body: JSON.stringify({ filename: file.name, mimetype: file.type || "application/octet-stream", dataBase64 })
  });
  if (!res.ok) { const e = await res.json().catch(() => ({})); throw new Error(e.error || "Upload failed"); }
  return res.json(); // { id, filename, mimetype, size }
}
function renderAttachmentsList(containerId) {
  if (!modalAttachments.length) return `<div class="sub" id="${containerId}">No files attached yet.</div>`;
  return `<div id="${containerId}" style="display:flex;flex-direction:column;gap:6px;">` +
    modalAttachments.map((a, i) => `
      <div style="display:flex;align-items:center;gap:8px;border:1px solid var(--border);border-radius:8px;padding:6px 10px;">
        <span>${fileIcon(a.mimetype)}</span>
        <span style="flex:1;font-size:12.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;cursor:pointer;" onclick="viewAttachment('${a.id}','${esc(a.filename)}')">${esc(a.filename)}</span>
        <span class="sub">${fmtFileSize(a.size)}</span>
        <button type="button" class="btn btn-sm" onclick="viewAttachment('${a.id}','${esc(a.filename)}')">View</button>
        <button type="button" class="btn btn-sm btn-red" onclick="removeAttachment(${i}, '${containerId}')">✕</button>
      </div>
    `).join("") + `</div>`;
}
function refreshAttachmentsUI(containerId) {
  const el = document.getElementById(containerId);
  if (el && el.parentElement) {
    const wrapper = document.createElement("div");
    wrapper.innerHTML = renderAttachmentsList(containerId);
    el.parentElement.replaceChild(wrapper.firstElementChild, el);
  }
}
async function handleAttachmentInput(inputEl, containerId) {
  const files = Array.from(inputEl.files || []);
  inputEl.value = ""; // allow re-selecting the same file later
  for (const file of files) {
    try {
      const uploaded = await apiUploadFile(file);
      modalAttachments.push(uploaded);
      refreshAttachmentsUI(containerId);
    } catch (e) {
      alert("Couldn't upload " + file.name + ": " + e.message);
    }
  }
}
function removeAttachment(index, containerId) {
  modalAttachments.splice(index, 1);
  refreshAttachmentsUI(containerId);
}
async function viewAttachment(id, filename) {
  try {
    const res = await fetch("/api/files/" + id, { headers: { Authorization: "Bearer " + getToken() } });
    if (!res.ok) throw new Error("File not found");
    const blob = await res.blob();
    const url = URL.createObjectURL(blob);
    if (blob.type === "application/pdf" || blob.type.startsWith("image/")) {
      window.open(url, "_blank"); // browser shows it inline
    } else {
      const a = document.createElement("a");
      a.href = url; a.download = filename; document.body.appendChild(a); a.click(); a.remove();
    }
    setTimeout(() => URL.revokeObjectURL(url), 60000);
  } catch (e) {
    alert("Couldn't open that file: " + e.message);
  }
}
function attachmentsSectionHtml(containerId, attachments) {
  modalAttachments = (attachments || []).slice();
  return `

function saveOrder(id) {
  const facInput = document.getElementById("o_facility").value;
  const rec = resolveFacilityInput(facInput);
  if (!rec) { alert("Please pick a valid facility from the suggestions list."); return; }
  const items = collectItems("o_items");
  if (!items.length) { alert("Add at least one item."); return; }
  const date = document.getElementById("o_date").value || todayStr();
  const status = document.getElementById("o_status").value;
  const notes = document.getElementById("o_notes").value.trim();
  const quoteId = document.getElementById("o_quoteId").value || null;
  const attachments = modalAttachments.slice();

  if (id) {
    const o = state.orders.find(x => x.id === id);
    Object.assign(o, { facilityId: rec.id, date, status, notes, items, attachments });
  } else {
    state.orderSeq += 1;
    state.orders.unshift({ id: uid(), seq: state.orderSeq, facilityId: rec.id, date, status, notes, items, attachments, quotationId: quoteId, createdAt: todayStr() });
    if (quoteId) { const q = state.quotations.find(x => x.id === quoteId); if (q) q.status = "Accepted"; }
  }
  save(); closeModal(); state.ui.view = "orders"; render();
}
function deleteOrder(id) {
  if (!confirm("Delete this order? This cannot be undone.")) return;
  state.orders = state.orders.filter(o => o.id !== id);
  save(); closeModal(); renderContent();
}
function printOrder(id) {
  const o = state.orders.find(x => x.id === id);
  const r = getRec(o.facilityId);
  const win = window.open("", "_blank");
  win.document.write(printDocHtml({
    title: "ORDER",
    docNo: orderLabel(o),
    date: o.date,
    extraMeta: [["Status", o.status]],
    facility: r,
    items: o.items,
    notes: o.notes
  }));
  win.document.close(); win.focus();
  setTimeout(() => win.print(), 300);
}

/* ===================== ANALYTICS ===================== */
function viewAnalytics() {
  const all = state.records;
  const now = todayStr();
  const allVisits = allVisitsFlat();

  const days = [];
  for (let i = 6; i >= 0; i--) { const d = addDays(now, -i); days.push({ label: d.slice(5), count: allVisits.filter(v => v.date === d).length }); }
  const maxDay = Math.max(1, ...days.map(d => d.count));

  const productTally = {};
  allVisits.forEach(v => { if (!v.products) return; v.products.split(",").map(s => s.trim()).filter(Boolean).forEach(p => { productTally[p] = (productTally[p] || 0) + 1; }); });
  const topProducts = Object.entries(productTally).sort((a, b) => b[1] - a[1]).slice(0, 8);
  const maxProd = Math.max(1, ...topProducts.map(p => p[1]));

  const zoneRows = state.zoneNames.map((name, i) => {
    const z = i + 1, inZone = all.filter(r => r.zone === z);
    const visited = inZone.filter(r => r.status !== "not_visited").length;
    const pct = inZone.length ? Math.round((visited / inZone.length) * 100) : 0;
    return { z, name, visited, total: inZone.length, pct };
  });

  const typeRows = [...new Set(all.map(r => r.type))].sort().map(t => {
    const inType = all.filter(r => r.type === t);
    const visited = inType.filter(r => r.status !== "not_visited").length;
    return { t, visited, total: inType.length, pct: inType.length ? Math.round((visited / inType.length) * 100) : 0 };
  });

  return `
    <div class="section-title">Analytics</div>
    <div class="grid-2" style="margin-bottom:14px;">
      <div class="chart-box"><h4>Visits — last 7 days</h4><div class="bar-chart">${days.map(d => `<div class="bar-col"><div class="bar-val">${d.count || ""}</div><div class="bar" style="height:${d.count ? Math.max(4, (d.count / maxDay) * 96) : 2}px"></div><div class="bar-label">${d.label}</div></div>`).join("")}</div></div>
      <div class="card"><div class="section-title" style="margin-bottom:8px;">Top products discussed</div>
        ${topProducts.length ? topProducts.map(([n, c]) => `<div class="coverage-item"><div class="coverage-top"><span>${esc(n)}</span><span>${c}</span></div><div class="progress-bg"><div class="progress-fg" style="width:${(c / maxProd) * 100}%"></div></div></div>`).join("") : '<div class="empty-state">Log an order in a visit to see product trends here.</div>'}
      </div>
    </div>

    ${reasonsCardHtml(allVisits)}

    <div class="section-title">Zone coverage <small>Visited vs total per zone</small></div>
    <div class="card" style="margin-bottom:14px;">
      ${zoneRows.map(z => `<div class="coverage-item"><div class="coverage-top"><span>Z${z.z} · ${esc(z.name)}</span><span>${z.visited}/${z.total}</span></div><div class="progress-bg"><div class="progress-fg" style="width:${z.pct}%"></div></div></div>`).join("")}
    </div>

    <div class="section-title">Facility type coverage</div>
    <div class="card">
      ${typeRows.map(t => `<div class="coverage-item"><div class="coverage-top"><span>${esc(t.t)}</span><span>${t.visited}/${t.total}</span></div><div class="progress-bg"><div class="progress-fg" style="width:${t.pct}%"></div></div></div>`).join("")}
    </div>
  `;
}

function saveVisit(facilityId, visitId) {
  const r = getRec(facilityId);
  const orderPlaced = document.getElementById("f_order").checked;
  const supplier = document.getElementById("f_supplier").value.trim();
  r.priority = document.getElementById("f_priority").value;
  if (supplier) r.currentSupplier = supplier;
  logVisitCore(facilityId, visitId || null, {
    date: document.getElementById("f_date").value || todayStr(),
    time: document.getElementById("f_time").value || "",
    status: document.getElementById("f_status").value,
    contact: document.getElementById("f_contact").value.trim(),
    role: document.getElementById("f_role").value,
    notes: document.getElementById("f_notes").value.trim(),
    orderPlaced,
    products: orderPlaced ? document.getElementById("f_products").value.trim() : "",
    nextAction: document.getElementById("f_nextaction").value.trim(),
    nextFollowUp: document.getElementById("f_followup").value || null,
    reason: orderPlaced ? "" : document.getElementById("f_reason").value
  }, [...document.querySelectorAll(".fvDone:checked")].map(c => c.value));
  closeModal(); renderContent();
}
function deleteVisit(facilityId, visitId) {
  if (!confirm("Delete this visit entry? This cannot be undone. Any open follow-up created by this visit will be cancelled.")) return;
  const r = getRec(facilityId);
  r.visits = r.visits.filter(v => v.id !== visitId);
  state.tasks.filter(t => t.visitId === visitId && isOpenTask(t)).forEach(t => cancelTask(t.id, "Its visit was deleted"));
  if (r.visits.length) {
    const sorted = r.visits.slice().sort((a, b) => (b.date + (b.time || "")).localeCompare(a.date + (a.time || "")));
    const latest = sorted[0];
    r.lastVisit = latest.date; r.status = latest.status;
  } else {
    r.lastVisit = null; r.status = "not_visited";
  }
  syncFollowUpRollup(facilityId);
  save(); closeModal(); renderContent();
}

/* ===================== SALES INSIGHTS (from invoiced sales data) ===================== */
const TREND_META = {
  "GROWING": { label: "Growing", cls: "t-good" }, "NEW": { label: "New", cls: "t-good" },
  "STEADY": { label: "Steady", cls: "t-ok" }, "SHRINKING": { label: "Shrinking", cls: "t-warn" },
  "AT RISK": { label: "At risk", cls: "t-bad" }, "DORMANT": { label: "Dormant", cls: "t-bad" }
};
const NO_ORDER_REASONS = ["Price", "Quality", "Delivery", "Payment / credit", "Uses another supplier / has stock", "Other"];
function insightsData() { const si = state.salesInsights; return si && si.clinics ? si : null; }
function insightFor(id) { const si = insightsData(); return si ? (si.clinics[id] || null) : null; }
function fmtAED(n) { return Math.round(n || 0).toLocaleString("en-US"); }
function trendPill(t) { const m = TREND_META[t] || { label: t, cls: "t-ok" }; return `<span class="trend-pill ${m.cls}">${esc(m.label)}</span>`; }
function insightLine(ins) {
  return `2026: <strong>${fmtAED(ins.prev + ins.you)} AED</strong> (${fmtAED(ins.prev)} previous rep Jan–Aug + ${fmtAED(ins.you)} you since 15 Aug) · last order ${esc(ins.last)}`;
}
function winBackList() {
  const si = insightsData(); if (!si) return [];
  return Object.entries(si.clinics)
    .filter(([id, ins]) => !ins.dupOf && ["AT RISK", "DORMANT", "SHRINKING"].includes(ins.trend) && getRec(+id))
    .map(([id, ins]) => ({ rec: getRec(+id), ins }))
    .sort((a, b) => (b.ins.prev + b.ins.you) - (a.ins.prev + a.ins.you));
}
function addWinBackToRoute(n) {
  let added = 0;
  winBackList().forEach(({ rec, ins }) => {
    if (added >= n || ins.credit || state.route.ids.includes(rec.id)) return;
    state.route.ids.push(rec.id); added++;
  });
  save(); renderContent();
  if (!added) alert("Nothing to add — the win-back clinics are already on today's route (or on credit hold).");
}
function winBackCardHtml() {
  const si = insightsData();

function salesTrendCardHtml() {
  const si = insightsData();
  if (!si || !si.meta || !si.meta.monthly || !si.meta.monthly.length) return "";
  const mo = si.meta.monthly, target = si.meta.target || 40000;
  const MN = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];
  const cur = mo.find(m => m.m === MN[new Date().getMonth()]) || mo[mo.length - 1];
  const curTot = (cur.prev || 0) + (cur.you || 0), pct = Math.round(curTot / target * 100);
  const maxV = Math.max(target, ...mo.map(m => (m.prev || 0) + (m.you || 0))), H = 140;
  const cols = mo.map(m => {
    const t = (m.prev || 0) + (m.you || 0);
    return `<div class="st-col"><div class="st-val">${t ? (t / 1000).toFixed(1) + "k" : ""}</div><div class="st-bar"><div class="st-you" style="height:${(m.you || 0) / maxV * H}px"></div><div class="st-prev" style="height:${(m.prev || 0) / maxV * H}px"></div></div></div>`;
  }).join("");
  return `<div class="card" style="margin-bottom:14px;">
    <div class="section-title">Sales trend vs target <small>Invoiced sales (AED) · as of ${fmtDate(si.meta.updated)}</small></div>
    <div class="st-head">
      <div><div class="st-big">${fmtAED(curTot)} <span class="sub">AED in ${cur.m}${cur.partial ? " so far" : ""}</span></div>
      <div class="sub">${pct}% of the ${fmtAED(target)} AED monthly target · <a href="#" onclick="setSalesTarget(); return false;">change target</a></div></div>
      <div class="st-legend"><span><i class="st-prev"></i>Previous rep</span><span><i class="st-you"></i>You</span><span><i class="st-tline"></i>Target</span></div>
    </div>
    <div class="st-plot" style="height:${H}px;"><div class="st-target" style="bottom:${Math.round(target / maxV * H)}px"></div>${cols}</div>
    <div class="st-labels">${mo.map(m => `<div>${m.m}${m.partial ? "*" : ""}</div>`).join("")}</div>
    <div class="sub" style="margin-top:6px;">* month still in progress. Source: Odoo journal entries.</div>
  </div>`;
}

  const si = insightsData(); if (!si) return;

      <button class="btn btn-red" onclick="if(confirm('Start with the default 640-facility list? Only do this if you have NO backup and no other device with your data.')){serverEmptyNoCache=false; save(); render();}">Start with the default list</button>
    </div></div></div>`;
}
function noDataRestore(evt) {
  const file = evt.target.files[0]; if (!file) return;
  const reader = new FileReader();
  reader.onload = () => {
    try {
      const parsed = JSON.parse(reader.result);
      if (!parsed || !Array.isArray(parsed.records)) throw new Error("bad");
      state = normalize(parsed); serverEmptyNoCache = false; save("restore"); state.ui.view = "today"; render();
    } catch (e) { alert("Could not read that file — make sure it's a FieldSales CRM backup JSON."); }
  };
  reader.readAsText(file);
}

/* ===================== SERVER SNAPSHOTS ===================== */
async function loadServerBackups() {
  const box = document.getElementById("serverBackups");
  box.textContent = "Loading…";
  try {
    const res = await fetch("/api/backups", { headers: { Authorization: "Bearer " + getToken() } });
    if (!res.ok) throw new Error("HTTP " + res.status);
    const { backups, dataDir } = await res.json();
    box.innerHTML = `<div style="margin-bottom:6px;">Database location: <b>${esc(dataDir)}</b></div>
      <button class="btn btn-sm btn-green" onclick="downloadServerBackup('current')">⬇ Download current server copy</button>
      <div style="margin-top:8px;">${backups.length ? backups.map(b => `<div style="padding:3px 0;">${esc(new Date(b.saved_at).toLocaleString("en-GB", { timeZone: APP_TZ }))} · ${esc(b.reason)} · ${Math.round(b.bytes / 1024)} KB <a href="#" onclick="downloadServerBackup(${b.id}); return false;">download</a></div>`).join("") : "No snapshots yet — they start after the next saves."}</div>`;
  } catch (e) { box.textContent = "Could not load snapshots (are you online?)"; }
}
async function downloadServerBackup(id) {
  const res = await fetch("/api/backups/" + id, { headers: { Authorization: "Bearer " + getToken() } });
  if (!res.ok) { alert("Download failed"); return; }
  const blob = await res.blob();
  const a = document.createElement("a"); a.href = URL.createObjectURL(blob);
  a.download = "fieldsales-server-backup-" + id + "-" + todayStr() + ".json";
  document.body.appendChild(a); a.click(); a.remove();
}

/* ===================== BACKUP ===================== */
function exportData() {
  const blob = new Blob([JSON.stringify(state, null, 2)], { type: "application/json" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob); a.download = `fieldsales-crm-backup-${todayStr()}.json`;
  document.body.appendChild(a); a.click(); a.remove();
}
function importData(evt) {
  const file = evt.target.files[0]; if (!file) return;
  const reader = new FileReader();
  reader.onload = () => {
    try {
      const parsed = JSON.parse(reader.result);
      if (!parsed || !Array.isArray(parsed.records)) throw new Error("bad format");
      if (!confirm("This will replace all current data with the imported backup. Continue?")) return;
      try { localStorage.setItem(STORAGE_KEY + "_beforeRestore", JSON.stringify(state)); } catch (e) {}
      if (!parsed.salesInsights && state && state.salesInsights) parsed.salesInsights = state.salesInsights;
      state = normalize(parsed); save("restore"); render();
    } catch (e) { alert("Could not read that file — make sure it's a FieldSales CRM backup JSON."); }
  };
  reader.readAsText(file); evt.target.value = "";
}
async function resetData() {
  if (!confirm("This will erase all changes (on every device) and restore the original 640-facility list. Continue?")) return;
  localStorage.removeItem(STORAGE_KEY);
  state = seedState();
  save("reset");
  render();
}

/* ===================== FOLLOW-UP TASK ENGINE =====================
   A follow-up is a task linked to a facility:
   { id, facilityId, title, dueDate, dueTime, priority, status, source, visitId,
     quoteId, orderId, product, createdAt, updatedAt, completedAt, history[] }
   status: open | rescheduled | completed | cancelled   (open + rescheduled = still to do)
   source: manual | visit | migrated | quotation | order | whatsapp | voice
   The facility's old `nextFollowUp` field is kept in sync (= earliest open task) so every
   existing screen, filter and sort keeps working. */
const TASK_SOURCES = { manual: "Manual", visit: "Visit", migrated: "Earlier follow-up", quotation: "Quotation", order: "Order", whatsapp: "WhatsApp", voice: "Voice note" };
const QUICK_TITLES = ["Send quotation", "Call back", "Visit again", "Deliver sample", "Collect payment / cheque", "Confirm order"];

function isOpenTask(t) { return t.status === "open" || t.status === "rescheduled"; }
function getTask(id) { return state.tasks.find(t => t.id === id); }
function openTasksFor(fid) { return state.tasks.filter(t => t.facilityId === fid && isOpenTask(t)).sort((a, b) => taskSortKey(a).localeCompare(taskSortKey(b))); }
function taskSortKey(t) { return (t.dueDate || "9999") + (t.dueTime || "99:99"); }
function normTitle(s) { return String(s || "").toLowerCase().replace(/[^a-z0-9]+/g, " ").trim(); }

// Make the facility's legacy nextFollowUp = earliest open task (or nothing).
function syncFollowUpRollup(fid) {
  const r = getRec(fid); if (!r) return;
  const open = openTasksFor(fid);
  r.nextFollowUp = open.length ? open[0].dueDate : null;
}
function touchTask(t, action, extra) {
  t.updatedAt = nowIso();
  t.history = t.history || [];
  t.history.push(Object.assign({ at: t.updatedAt, action }, extra || {}));
}

// One-time conversion of the old "next follow-up date" on each facility into a task.
// Ids and timestamps are deterministic so two devices migrating separately produce identical tasks.
function migrateFollowUpsToTasks(s) {
  const existing = new Set(s.tasks.map(t => t.id));
  s.records.forEach(r => {
    if (!r.nextFollowUp) return;
    const id = "mig-" + r.id + "-" + r.nextFollowUp;
    if (existing.has(id)) return;
    const v = (r.visits || []).filter(x => x.nextFollowUp === r.nextFollowUp)
      .sort((a, b) => (b.date + (b.time || "")).localeCompare(a.date + (a.time || "")))[0];
    const note = v && v.notes ? v.notes.trim() : "";
    s.tasks.push({
      id, facilityId: r.id, title: note ? "Follow up — " + note.slice(0, 80) : "Follow up",
      dueDate: r.nextFollowUp, dueTime: "", priority: r.priority || "Medium", status: "open",
      source: "migrated", visitId: v ? v.id : null, quoteId: null, orderId: null, product: "",
      createdAt: (v ? v.date : r.nextFollowUp) + "T00:00:00.000Z", updatedAt: "2026-10-19T00:00:00.000Z", completedAt: null,
      history: [{ at: "2026-10-19T00:00:00.000Z", action: "created", note: "Converted from the facility's follow-up date" }]
    });
  });
  s.tasksMigrated = true;
}

// Find an open task for the same facility that looks like the same action.
function findSimilarOpenTask(fid, title, excludeId) {
  const n = normTitle(title);
  if (!n) return null;
  return openTasksFor(fid).find(t => {
    if (t.id === excludeId) return false;
    const m = normTitle(t.title);
    return m === n || (m.length > 6 && n.length > 6 && (m.includes(n) || n.includes(m)));
  }) || null;
}

function createTask(fields) {
  const t = Object.assign({
    id: "t" + uid(), facilityId: null, title: "Follow up", dueDate: todayStr(), dueTime: "",
    priority: "Medium", status: "open", source: "manual", visitId: null, quoteId: null, orderId: null,
    product: "", createdAt: nowIso(), updatedAt: nowIso(), completedAt: null, history: []
  }, fields);
  t.history = [{ at: t.createdAt, action: "created", note: TASK_SOURCES[t.source] || t.source }];
  state.tasks.push(t);
  syncFollowUpRollup(t.facilityId);
  return t;
}
function completeTask(id, note) {
  const t = getTask(id); if (!t || !isOpenTask(t)) return;
  t.status = "completed"; t.completedAt = nowIso();
  touchTask(t, "completed", note ? { note } : null);
  syncFollowUpRollup(t.facilityId);
}
function reopenTask(id) {
  const t = getTask(id); if (!t) return;
  t.status = "open"; t.completedAt = null; touchTask(t, "reopened");
  syncFollowUpRollup(t.facilityId);
}
function rescheduleTask(id, newDate, newTime) {
  const t = getTask(id); if (!t || !newDate) return;
  if (t.dueDate === newDate && (newTime === undefined || t.dueTime === newTime)) return;
  const from = t.dueDate;
  t.dueDate = newDate; if (newTime !== undefined) t.dueTime = newTime || "";
  if (isOpenTask(t)) t.status = "rescheduled";
  touchTask(t, "rescheduled", { from, to: newDate });
  syncFollowUpRollup(t.facilityId);
}
function cancelTask(id, note) {
  const t = getTask(id); if (!t || !isOpenTask(t)) return;
  t.status = "cancelled"; touchTask(t, "cancelled", note ? { note } : null);
  syncFollowUpRollup(t.facilityId);
}
function rescheduleCount(t) { return (t.history || []).filter(h => h.action === "rescheduled").length; }

/* ---------- date helpers ---------- */
function dueBucket(t, now) {
  if (!isOpenTask(t)) return "done";
  if (t.dueDate < now) return "overdue";
  if (t.dueDate === now) return "today";
  if (t.dueDate === addDays(now, 1)) return "tomorrow";
  if (t.dueDate <= addDays(now, 7)) return "week";
  return "later";
}
function dueLabel(t) {
  const now = todayStr(), d = daysDiff(now, t.dueDate);
  let lbl = d < 0 ? `${-d}d overdue` : d === 0 ? "Today" : d === 1 ? "Tomorrow" : `In ${d}d · ${fmtDate(t.dueDate)}`;
  if (t.dueTime) lbl += " · " + t.dueTime;
  return lbl;
}
function weekdayName(dateStr) { return new Date(dateStr + "T12:00:00").toLocaleDateString("en-GB", { weekday: "short" }); }
function quickDates() {
  const now = todayStr();
  return [
    { lbl: "Tomorrow", d: addDays(now, 1) },
    { lbl: "In 3 days", d: addDays(now, 3) },
    { lbl: "1 week", d: addDays(now, 7) },
    { lbl: "2 weeks", d: addDays(now, 14) }
  ];
}

/* ---------- phone helpers (tap to call / open WhatsApp chat — you always press send yourself) ---------- */
function phoneDigits(p) {
  let d = String(p || "").replace(/[^0-9]/g, "");
  if (!d) return "";
  if (d.startsWith("00")) d = d.slice(2);
  if (d.startsWith("0")) d = "971" + d.slice(1);
  if (d.length === 9 && d.startsWith("5")) d = "971" + d; // local mobile without 0
  return d.length >= 9 ? d : "";
}
function contactButtons(r) {
  const p = phoneDigits(r && (r.whatsapp || r.phone));
  if (!p) return "";
  const mobile = /^9715/.test(p);
  return `<a class="btn btn-sm" href="tel:+${p}">📞 Call</a>` +
    (mobile ? `<a class="btn btn-sm" href="https://wa.me/${p}" target="_blank" rel="noopener">💬 WhatsApp</a>` : "");
}
function lastInteraction(r) {
  if (!r || !r.visits || !r.visits.length) return "No visits logged yet";
  const v = r.visits.slice().sort((a, b) => (b.date + (b.time || "")).localeCompare(a.date + (a.time || "")))[0];
  const bits = [fmtDate(v.date), statusMeta(v.status).label];
  if (v.contact) bits.push("met " + v.contact);
  let s = bits.join(" · ");
  if (v.notes) s += " — " + v.notes.slice(0, 90) + (v.notes.length > 90 ? "…" : "");
  return s;
}

/* ---------- toast with undo ---------- */
let toastTimer = null;
function toast(msg, actionLabel, actionFn) {
  let el = document.getElementById("toast");
  if (!el) { el = document.createElement("div"); el.id = "toast"; document.body.appendChild(el); }
  el.innerHTML = `<span>${esc(msg)}</span>` + (actionLabel ? `<button id="toastAct">${esc(actionLabel)}</button>` : "");
  el.classList.add("show");
  if (actionLabel) document.getElementById("toastAct").onclick = () => { el.classList.remove("show"); actionFn(); };
  clearTimeout(toastTimer); toastTimer = setTimeout(() => el.classList.remove("show"), 6000);
}

/* ---------- task actions wired to buttons ---------- */
// Re-render the page, and the customer card too if it's the window currently open.

/* ===================== TODAY SCREEN ===================== */
function tasksByBucket() {
  const now = todayStr();
  const prio = { High: 0, Medium: 1, Low: 2 };
  const out = { overdue: [], today: [], tomorrow: [], week: [], later: [], done: [] };
  state.tasks.forEach(t => { if (getRec(t.facilityId)) out[dueBucket(t, now)].push(t); });
  // overdue: high priority first, then oldest first
  out.overdue.sort((a, b) => (prio[a.priority] ?? 1) - (prio[b.priority] ?? 1) || taskSortKey(a).localeCompare(taskSortKey(b)));
  ["today", "tomorrow", "week", "later"].forEach(k => out[k].sort((a, b) => taskSortKey(a).localeCompare(taskSortKey(b)) || (prio[a.priority] ?? 1) - (prio[b.priority] ?? 1)));
  const weekAgo = addDays(now, -7);
  out.done = out.done.filter(t => (t.completedAt || t.updatedAt || "").slice(0, 10) >= weekAgo)
    .sort((a, b) => (b.completedAt || b.updatedAt || "").localeCompare(a.completedAt || a.updatedAt || ""));
  return out;
}
function notContactedRecently() {
  const now = todayStr(), cutoff = addDays(now, -30);
  const openFids = new Set(state.tasks.filter(isOpenTask).map(t => t.facilityId));
  return state.records
    .filter(r => r.status === "customer" && !openFids.has(r.id) && (!r.lastVisit || r.lastVisit < cutoff))
    .sort((a, b) => (a.priority === "High" ? 0 : 1) - (b.priority === "High" ? 0 : 1) || (a.lastVisit || "").localeCompare(b.lastVisit || ""));
}
function todaySection(key, title, list, opts) {

      <h3>${title} <span class="count">${list.length}</span></h3>
      ${opts.headRight || (opts.collapsible ? `<span class="sub">${collapsed ? "Show ▾" : "Hide ▴"}</span>` : "")}
    </div>

  </section>`;
}

      ${state.ui.open_quiet ? (quiet.length ? quiet.slice(0, 25).map(r => `<div class="route-row"><div><div class="task-fac" onclick="openDetail(${r.id})">${esc(r.name)}</div><div class="sub">${esc(r.area)} · ${r.lastVisit ? "last visit " + fmtDate(r.lastVisit) : "never visited"}</div></div><button class="btn btn-sm" onclick="openNewTask(${r.id})">+ Follow-up</button></div>`).join("") + (quiet.length > 25 ? `<div class="sub" style="padding:6px 2px;">+ ${quiet.length - 25} more</div>` : "") : `<div class="empty-state">Every customer has been contacted recently or has a follow-up.</div>`) : ""}
